[package]
name = "hvolt"
version = "26.0.0-9"
edition = "2021"
rust-version = "1.85"
description = "HarmonyOS community build tool — flat project structure, minimal config"
license = "GPL-3.0-or-later"
repository = "https://github.com/hvolt-project/hvolt"
homepage = "https://github.com/hvolt-project/hvolt#readme"
readme = "README.md"
keywords = ["harmonyos", "openharmony", "hap", "build-tool", "arkts"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "hvolt"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"   # no symbol names in shipped binaries
panic = "abort"

[features]
default = ["usb"]
# Native USB device transport (desktop side). Off for embedders: on a device the
# IDE reaches its own hdcd over TCP, and nusb does not build for ohos.
usb = ["dep:nusb"]
# Device-side posture: consumed by the embedder build (libhvolt.so).
ohos = []
# Compile the AppGallery Connect backend from an `agc-local/` overlay next to
# this crate. The overlay is not part of this repository.
agc-local = []

[lib]
# rlib for the binary, cdylib for embedders (the on-device IDE loads it via NAPI).
name = "hvolt"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[profile.ohos]
# Embedder profile: a panic inside a command must not take the host app down,
# so the cdylib unwinds and the FFI boundary catches it.
inherits = "release"
panic = "unwind"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# hdc wire protocol: RSA-3072 challenge-response, PKCS#1 v1.5 over SHA-256.
rsa = { version = "0.9", features = ["sha2", "pem"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# Native USB transport to hdcd (enumerate + bulk endpoints). Pure Rust, no
# libusb; each platform backend is implemented in-tree by nusb.
nusb = { version = "0.2", optional = true }
regex-lite = "0.1"
hapsigner = { version = "0.2.0", default-features = false }
# Already pulled in by hapsigner; used directly to read a certificate's notAfter.
x509-cert = "0.2"
der = "0.7"
oxc_parser = "0.75.0"
oxc_allocator = "0.75.0"
oxc_span = "0.75.0"
oxc_ast = "0.75.0"
oxc_ast_visit = "0.75.1"
oxc_semantic = "0.75.1"
oxc_codegen = "0.75.0"
rcgen = { version = "0.14.7", features = ["pem"] }
p12 = "0.6"
pkcs8 = "0.10"
p256 = "0.13"
rhai = { version = "1.27.0", default-features = false, features = ["std"] }
jsonschema = { version = "0.61.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ─── Code cleanliness gate (see CONTRIBUTING.md) ───
# These hold for the whole crate; `cargo clippy --all-targets -- -D warnings`
# is the review gate, `cargo fmt --check` the formatting one.
[lints.rust]
unsafe_code = "warn"     # two sites, both documented: SIGPIPE reset in main.rs, gethostname in platform.rs
unused_must_use = "warn" # a dropped Result is a swallowed error

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
