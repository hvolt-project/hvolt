name: oidc-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install -g npm@11 >/dev/null 2>&1
          echo "npm $(npm --version) at $(command -v npm)"
          for name in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN NODE_AUTH_TOKEN; do
            if [ -n "$(printenv "$name" || true)" ]; then echo "$name: set"; else echo "$name: unset"; fi
          done
