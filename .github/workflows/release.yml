name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only — skip GitHub release and npm publish"
        type: boolean
        default: true

permissions:
  contents: read

# Merging two pull requests in a row started two releases for the same version, each
# building three targets on the same runners (measured 2026-10-19: runs 39277516701 and
# 39277548684, both for 26.0.0-1, both with the same three builds). They are idempotent —
# a published package is skipped and a release is re-uploaded with --clobber — but they
# queue behind each other, so one is enough. `cancel-in-progress` stays false: cancelling a
# run halfway through `npm publish` is worse than waiting for it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: does this version need a release?
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A merge to main only releases when the version actually moved, so ordinary
      # merges do not republish. The tag is the record of what has shipped, and the
      # version in the manifests is the source of truth for the next one.
      - id: check
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          pkg="$(node -p 'require("./npm/package.json").version')"
          test "$manifest" = "$pkg" || {
            echo "Cargo.toml says $manifest, npm/package.json says $pkg"; exit 1; }

          # Two ways in: a tag (someone decided to release) or a merge to main (the
          # version moved). Both end at the same place, and neither needs the other.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$manifest" || {
              echo "tag $GITHUB_REF_NAME does not match the manifests ($manifest)"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "releasing the tag v$version"
          elif git rev-parse -q --verify "refs/tags/v$manifest" >/dev/null; then
            version="$manifest"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged — nothing to release"
          else
            version="$manifest"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new — release it"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.key }})
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bin: hvolt
            archive: tar.gz
          - key: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: hvolt
            archive: tar.gz
          - key: win32-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bin: hvolt.exe
            archive: zip
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Gate (fmt, clippy, tests)
        if: matrix.key == 'linux-x64'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          mkdir -p dist
          chmod +x "$src"
          tar -czf "dist/hvolt-${version}-${{ matrix.key }}.tar.gz" -C "$(dirname "$src")" "${{ matrix.bin }}"
          "$src" --version

      - name: Package (zip)
        # GNU tar on the Windows runner treats "D:" in -f as a remote host, so
        # zip archives are produced with PowerShell instead.
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # `github.ref_name` is the branch name on a push to main: the archive came out
          # as `hvolt-main-win32-x64.zip` while publish expected the version, and the
          # release run failed there (measured: run 39275018157, "Stage binaries").
          $version = "${{ needs.guard.outputs.version }}"
          $src = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $src -DestinationPath "dist/hvolt-$version-${{ matrix.key }}.zip"
          & $src --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [guard, build]
    if: needs.guard.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # No `registry-url`: setup-node then writes an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}` and exports the placeholder
          # `XXXXX-XXXXX-XXXXX-XXXXX` when the env var is absent (its source), which
          # makes npm try token auth instead of trusted publishing.
          node-version: 22

      # Trusted publishing needs a newer npm than the one bundled with Node 22.
      - name: npm with OIDC support
        run: |
          npm install -g npm@11
          npm --version

      # The publish below authenticates through the OIDC identity, so a missing token
      # request URL is the difference between "trusted publisher not configured" and
      # "something else went wrong" — print it before publishing rather than after.
      - name: publish preflight
        run: |
          echo "npm $(npm --version), node $(node --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: available"
          else
            echo "OIDC: MISSING — the job needs permissions: id-token: write"
            exit 1
          fi

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tag_version="${{ needs.guard.outputs.version }}"
          pkg_version="$(node -p 'require("./npm/package.json").version')"
          test "$tag_version" = "$pkg_version" || {
            echo "guard version does not match npm/package.json $pkg_version"; exit 1; }
          echo "version $pkg_version"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          # Plain file names, so the installer can match by name alone.
          (cd dist && sha256sum */* | sed 's|  .*/|  |' > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          mkdir -p npm/platforms/darwin-arm64/bin npm/platforms/linux-x64/bin npm/platforms/win32-x64/bin
          tar -xzf "dist/darwin-arm64/hvolt-${version}-darwin-arm64.tar.gz" -C npm/platforms/darwin-arm64/bin
          tar -xzf "dist/linux-x64/hvolt-${version}-linux-x64.tar.gz" -C npm/platforms/linux-x64/bin
          unzip -q "dist/win32-x64/hvolt-${version}-win32-x64.zip" -d npm/platforms/win32-x64/bin
          chmod +x npm/platforms/darwin-arm64/bin/hvolt npm/platforms/linux-x64/bin/hvolt
          ls -l npm/platforms/*/bin/

      - name: Build language server bundle
        # The launcher package ships lsp/dist/server.cjs; it is built here rather
        # than committed.
        run: |
          set -euo pipefail
          npm ci --prefix lsp
          npm --prefix lsp run build
          # npm packages can only ship files under npm/, so the bundle is copied in.
          mkdir -p npm/lsp/dist
          cp lsp/dist/server.cjs npm/lsp/dist/server.cjs

      - name: Attach LICENSE to every package
        if: vars.NPM_PUBLISH == 'true'
        run: |
          set -euo pipefail
          cp LICENSE npm/LICENSE
          for key in darwin-arm64 linux-x64 win32-x64; do cp LICENSE "npm/platforms/$key/LICENSE"; done

      - name: Sync package versions from the tag
        # Versions live in five manifests; deriving them from the tag keeps the
        # published packages and the release in step without hand edits.
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const keys = ["darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64", "win32-x64"];
            const files = ["npm/package.json", ...keys.map(k => `npm/platforms/${k}/package.json`)];
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              for (const dep of Object.keys(pkg.optionalDependencies || {})) {
                pkg.optionalDependencies[dep] = version;
              }
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
          ' "$version"

      - name: Publish platform packages
        if: vars.NPM_PUBLISH == 'true'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          for key in darwin-arm64 linux-x64 win32-x64; do
            pkg="@hvolt/cli-$key"
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "  $pkg@$version already published — skipping"
            else
              echo "  publishing $pkg@$version"
              # ENEEDAUTH here means npm found no OIDC identity for this package: the
              # trusted publisher is configured per package on npmjs.com, so each of the
              # four needs the same three fields, not just the launcher.
              (cd "npm/platforms/$key" && npm publish --access public --provenance --tag latest) || {
                echo "::error::$pkg did not authenticate. Set its trusted publisher on npmjs.com:"
                echo "::error::  owner/repository hvolt-project/hvolt, workflow file release.yml"
                exit 1
              }
            fi
          done

      - name: Publish launcher
        if: vars.NPM_PUBLISH == 'true'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if npm view "@hvolt/cli@$version" version >/dev/null 2>&1; then
            echo "  @hvolt/cli@$version already published — skipping"
          else
            cd npm && npm publish --access public --provenance --tag latest
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.guard.outputs.version }}"
          assets=(dist/*/* dist/SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a release (e.g. publishing npm after the fact) must not fail
            # on the release that already exists.
            gh release upload "$tag" "${assets[@]}" --clobber
            # Uploading does not publish a draft: a release recreated against a moved
            # tag stays draft, and /releases/latest then 404s for the installers.
            gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --notes-file "CHANGELOG.md" \
              --verify-tag
          fi
