name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lsp:
    name: lsp (typecheck + bundle)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lsp/package-lock.json
      - run: npm ci --prefix lsp
      - name: tsc --noEmit
        working-directory: lsp
        run: npx tsc --noEmit
      - run: npm --prefix lsp run build

  vscode:
    name: vscode extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json
      - run: npm ci
        working-directory: editor/vscode
      - run: npx tsc --noEmit
        working-directory: editor/vscode
      - run: node build.mjs
        working-directory: editor/vscode
      - run: node --test test/
        working-directory: editor/vscode

  gate:
    name: fmt, clippy, tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
